# Render "Blueprint": New + > Blueprint > pick your GitHub repo.
# Render has no managed MySQL, so DB_URL / DB_USER / DB_PASS point to a MySQL you host elsewhere.
services:
  - type: web
    name: cms
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
