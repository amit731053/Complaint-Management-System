# ---- PRODUCTION: everything comes from environment variables ----
# Required: DB_URL (e.g. jdbc:mysql://host:3306/cms_db?useSSL=true&characterEncoding=UTF-8), DB_USER, DB_PASS
# Optional: APP_ADMIN_EMAIL, APP_ADMIN_PASSWORD (first admin), PORT
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# 'update' creates tables on first run. Move to Flyway + 'validate' later.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Cookie only over HTTPS (set COOKIE_SECURE=false only for plain-HTTP testing)
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.port=${PORT:8080}

# Small pool: free MySQL hosts allow few connections. Keepalive = a tiny query every 5 min on idle connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.max-lifetime=1500000
