# ---- LOCAL DEVELOPMENT: in-memory H2, nothing to install ----
spring.datasource.url=jdbc:h2:mem:cms;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# DEV-ONLY admin so you can log in locally. NOT used in prod.
app.admin.email=${APP_ADMIN_EMAIL:admin@cms.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}

server.servlet.session.cookie.secure=false
