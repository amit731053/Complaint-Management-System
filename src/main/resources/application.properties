# ---- Common settings (no secrets in this file) ----
spring.application.name=cms
spring.profiles.default=dev

# Never leak stack traces / internal messages to clients
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Session cookie hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h

# Needed when running behind Nginx / a cloud load balancer that terminates HTTPS
# (native = Tomcat reads X-Forwarded-For/Proto from trusted proxies, so client IP and HTTPS are correct)
server.forward-headers-strategy=native

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Kolkata

# First admin (optional). Set APP_ADMIN_EMAIL and APP_ADMIN_PASSWORD in the environment.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:Admin}

# Login brute-force protection (per email / per IP, inside the window)
app.security.login-max-attempts=5
app.security.login-max-attempts-per-ip=300
app.security.login-window-minutes=15
