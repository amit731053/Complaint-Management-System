<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <script src="common.js"></script>
    <link rel="stylesheet" href="tailwind.css">
    <script>
        const user = JSON.parse(sessionStorage.getItem("user") || "null");

        if (!user || !user.email) {
            sessionStorage.clear();
            window.location.replace("index.html");
        }

        window.addEventListener("pageshow", function (event) {
            if (event.persisted) {
                const user = JSON.parse(sessionStorage.getItem("user") || "null");
                if (!user || !user.email) {
                    window.location.replace("index.html");
                }
            }
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - UniSupport</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        /* Smooth transitions */
        * {
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #3f3f46;
        }

        .btn-press:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }

        /* Status Badge Tweak */
        .status-badge {
            font-weight: 600;
            letter-spacing: 0.025em;
        }
    </style>
</head>

<body class="bg-[#f4f5f7] dark:bg-zinc-950 text-gray-800 dark:text-gray-200 min-h-screen overflow-x-hidden flex">

    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-[260px] bg-white dark:bg-zinc-900 border-r border-gray-200 dark:border-zinc-800 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-sm dark:shadow-none flex flex-col">
        <div class="h-[75px] px-6 flex items-center border-b border-gray-100 dark:border-zinc-800">
            <div class="flex items-center gap-2">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-600 to-indigo-400 text-white flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-graduation-cap text-sm"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-[#3b5278] dark:text-gray-100">Uni<span
                        class="text-indigo-600 dark:text-indigo-400">Support</span></h1>
            </div>
        </div>

        <nav class="flex-1 pt-6 pb-4 space-y-1">
            <p class="px-6 text-[11px] font-semibold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">
                Main Menu</p>

            <a href="dashboard.html"
                class="nav-item mx-3 px-3 py-2.5 rounded-md flex items-center text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-zinc-800/50 font-medium text-sm transition-colors">
                <i class="fa-solid fa-table-columns w-6 text-center"></i>
                <span class="ml-2">Dashboard</span>
            </a>

            <a href="my-complaints.html"
                class="nav-item mx-3 px-3 py-2.5 rounded-md flex items-center bg-blue-50 dark:bg-zinc-800 text-blue-700 dark:text-indigo-300 font-medium text-sm transition-colors relative">
                <span
                    class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-indigo-600 dark:bg-indigo-400 rounded-r-md"></span>
                <i class="fa-solid fa-file-lines w-6 text-center"></i>
                <span class="ml-2">Ticket Details</span>
            </a>

            <a href="add-complaint.html"
                class="nav-item mx-3 px-3 py-2.5 rounded-md flex items-center text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-zinc-800/50 font-medium text-sm transition-colors">
                <i class="fa-solid fa-plus-circle w-6 text-center"></i>
                <span class="ml-2">New Request</span>
            </a>

            <div class="my-5 border-t border-gray-100 dark:border-zinc-800"></div>

            <p class="px-6 text-[11px] font-semibold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">
                System</p>

            <a href="dashboard.html"
                class="nav-item mx-3 px-3 py-2.5 rounded-md flex items-center text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-zinc-800/50 font-medium text-sm transition-colors">
                <i class="fa-solid fa-chart-line w-6 text-center"></i>
                <span class="ml-2">Reports</span>
            </a>
        </nav>

        <div class="p-4 border-t border-gray-100 dark:border-zinc-800 bg-gray-50/50 dark:bg-zinc-900">
            <div class="flex items-center gap-3">
                <img id="userAvatar" src=""
                    class="w-9 h-9 rounded-full border-2 border-white dark:border-zinc-700 shadow-sm">
                <div class="flex-1 min-w-0">
                    <p id="username" class="text-sm font-semibold text-gray-800 dark:text-gray-200 truncate">User</p>
                    <a href="#" onclick="logout()" class="text-red-500">Logout</a>
                </div>
            </div>
        </div>
    </aside>

    <div id="mobile-overlay" class="fixed inset-0 bg-gray-900/60 z-30 hidden md:hidden transition-opacity"></div>

    <main class="flex-1 md:ml-[260px] flex flex-col min-h-screen relative">

        <header
            class="h-[75px] bg-white dark:bg-zinc-900 border-b border-gray-200 dark:border-zinc-800 px-6 flex items-center justify-between sticky top-0 z-20 shadow-sm dark:shadow-none">
            <div class="flex items-center">
                <button id="sidebar-toggle"
                    class="md:hidden mr-4 text-gray-500 dark:text-gray-400 p-2 rounded-md hover:bg-gray-100 dark:hover:bg-zinc-800 btn-press">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <h2 class="text-lg font-bold text-gray-800 dark:text-gray-100">Ticket Details</h2>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()"
                    class="w-9 h-9 rounded-md flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-800 transition-colors btn-press">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
                <button onclick="window.location.href='add-complaint.html'"
                    class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-indigo-700 transition-colors shadow-sm btn-press">
                    <i class="fa-solid fa-plus mr-1 text-xs"></i> New Ticket
                </button>
            </div>
        </header>

        <div class="p-6 lg:p-8 flex-1 animate-[fadeIn_0.4s_ease-out]">

            <div class="max-w-4xl mx-auto">

                <button onclick="window.location.href='my-complaints.html'"
                    class="mb-4 px-4 py-2 bg-gray-200 dark:bg-zinc-800 rounded-lg">
                    ← Back to My Tickets
                </button>

                <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-xl p-6">

                    <h2 id="ticketTitle" class="text-2xl font-bold mb-4">
                        Loading...
                    </h2>

                    <div class="grid md:grid-cols-2 gap-4 mb-6">

                        <div>
                            <p class="text-gray-500 text-sm">Ticket ID</p>
                            <p id="ticketId"></p>
                        </div>

                        <div>
                            <p class="text-gray-500 text-sm">Status</p>
                            <p id="ticketStatus" class="inline-block px-3 py-1 rounded-full text-xs font-bold">
                            </p>
                        </div>

                        <div>
                            <p class="text-gray-500 text-sm">Category</p>

                            <select id="ticketCategory" class="border rounded px-2 py-1 w-full" disabled>

                                <option value="it_network">IT & Network (Wi-Fi, Portals)</option>
                                <option value="hardware">Hardware & Lab Equipment</option>
                                <option value="maintenance">Facilities & Maintenance</option>
                                <option value="hostel">Hostel & Mess Management</option>
                                <option value="library">Library & Resources</option>
                                <option value="accounts">Accounts & Fee Section</option>
                                <option value="sports">Sports & Events</option>
                                <option value="other">Other</option>

                            </select>
                        </div>

                        <div>
                            <p class="text-gray-500 text-sm">Priority</p>

                            <select id="ticketPriority" class="border rounded px-2 py-1 w-full" disabled>

                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>

                            </select>
                        </div>
                        <div>
                            <p class="text-gray-500 text-sm">Created On</p>
                            <p id="ticketDate"></p>
                        </div>

                    </div>

                    <div class="mb-6">
                        <p class="text-gray-500 text-sm mb-2">Description</p>
                        <textarea id="ticketDescription"
                            class="w-full p-4 bg-gray-50 dark:bg-zinc-800 rounded-lg border resize-none" rows="5"
                            disabled></textarea>
                    </div>
                    <div id="editSection" class="hidden mb-4 flex gap-2">

                        <button id="editBtn" onclick="enableEdit()"
                            class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                            ✏ Edit Ticket
                        </button>

                        <button id="saveBtn" onclick="saveTicket()"
                            class="hidden bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                            💾 Save
                        </button>

                    </div>

                    <div id="commentBox" class="hidden">
                        <p class="text-gray-500 text-sm mb-2">Admin Comment</p>

                        <div id="ticketComment" class="p-4 bg-indigo-50 dark:bg-zinc-800 rounded-lg">
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <script>
        function logout() {
            sessionStorage.removeItem("user");
            serverLogout().finally(() => {
                sessionStorage.setItem("logoutSuccess", "true");
                window.location.replace("index.html");
            });
        }

        // SIDEBAR TOGGLE
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');
        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            mobileOverlay.classList.toggle('hidden');
        }
        document.getElementById('sidebar-toggle')?.addEventListener('click', toggleSidebar);
        mobileOverlay.addEventListener('click', toggleSidebar);

        // DARK MODE
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun';
        }

        
        </script>
    <script>
        function toggleDesc(el) {
            const shortText = el.querySelector(".short-text");
            const fullText = el.querySelector(".full-text");

            if (fullText.classList.contains("hidden")) {
                fullText.classList.remove("hidden");
                shortText.classList.add("hidden");
            } else {
                fullText.classList.add("hidden");
                shortText.classList.remove("hidden");
            }
        }
        function showComment(comment) {
            alert("Admin Comment:\n\n" + comment);
        }
        function openTicket(id) {

            window.location.href = `ticket-details.html?id=${id}`;

        }



        function loadTicketDetails() {

            const params = new URLSearchParams(window.location.search);

            const id = params.get("id");

            fetch(`/api/complaints/${id}`)
                .then(res => {
                    if (!res.ok) {
                        // 403 = not your ticket, 404 = does not exist (enforced by the server)
                        alert(res.status === 404 ? "Ticket not found" : "Access Denied");
                        window.location.href = "dashboard.html";
                        return null;
                    }
                    return res.json();
                })
                .then(c => {
                    if (!c) return;
                    const currentUser =
                        JSON.parse(sessionStorage.getItem("user") || "null");

                    if (
                        c.userEmail !== currentUser.email &&
                        currentUser.role !== "ADMIN"
                    ) {

                        alert("Access Denied");

                        window.location.href = "dashboard.html";

                        return;
                    }

                    document.getElementById("ticketTitle").innerText =
                        (c.title || "").toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
                    document.getElementById("ticketId").innerText = "#" + c.id;
                    const statusEl = document.getElementById("ticketStatus");

                    statusEl.innerText = c.status;

                    if (c.status === "RESOLVED") {
                        statusEl.classList.add("bg-green-100", "text-green-700");
                    } else {
                        statusEl.classList.add("bg-blue-100", "text-blue-700");
                    }
                    document.getElementById("ticketCategory").value = c.category;
                    document.getElementById("ticketPriority").value = c.priority;

                    document.getElementById("ticketDate").innerText =
                        new Date(c.createdAt).toLocaleString();

                    document.getElementById("ticketDescription").value = c.description;
                    if (c.status === "PENDING") {
                        document.getElementById("editSection")
                            .classList.remove("hidden");
                    }
                    if (c.hasComment) {
                        document.getElementById("commentBox").classList.remove("hidden");
                        document.getElementById("ticketComment").innerText = c.adminComment;
                    }
                });
        }
        function enableEdit() {

            document.getElementById("ticketCategory").disabled = false;
            document.getElementById("ticketPriority").disabled = false;
            document.getElementById("ticketDescription").disabled = false;

            document.getElementById("saveBtn")
                .classList.remove("hidden");
        }

        function saveTicket() {

            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            const description =
                document.getElementById("ticketDescription").value;

            if (
                description.includes("<") ||
                description.includes(">")
            ) {
                showToast("Invalid Description", false);
                return;
            }

            fetch(`/api/complaints/${id}/edit`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({

                    title: document.getElementById("ticketTitle").innerText,

                    description: document.getElementById("ticketDescription").value,

                    category: document.getElementById("ticketCategory").value,

                    priority: document.getElementById("ticketPriority").value
                })
            })
                .then(res => {

                    if (!res.ok) {
                        throw new Error("Update Failed");
                    }

                    return res.json();
                })
                .then(() => {

                    showToast("Ticket Updated");

                    document.getElementById("ticketCategory").disabled = true;
                    document.getElementById("ticketPriority").disabled = true;
                    document.getElementById("ticketDescription").disabled = true;

                    document.getElementById("saveBtn")
                        .classList.add("hidden");

                })
                .catch(err => {

                    console.log(err);

                    showToast("Update Failed", false);
                });
        }
        window.addEventListener("DOMContentLoaded", loadTicketDetails);
        const currentUser =
            JSON.parse(sessionStorage.getItem("user") || "null");

        if (currentUser && currentUser.name) {
            document.getElementById("username").innerText =
                currentUser.name;
            
            document.getElementById("userAvatar").src =
        `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.name)}&background=cbd5e1&color=334155`;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script>
        function showToast(message, success = true) {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "bottom",
                position: "right",
                close: true,
                stopOnFocus: true,
                style: {
                    background: success
                        ? "linear-gradient(to right, #00b09b, #96c93d)"
                        : "linear-gradient(to right, #ff416c, #ff4b2b)"
                }
            }).showToast();
        }
    </script>
</body>

</html>
