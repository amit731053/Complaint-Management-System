<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <script src="common.js"></script>
    <link rel="stylesheet" href="tailwind.css">
    <script>
        const user = JSON.parse(sessionStorage.getItem("user") || "null");

        if (!user || !user.email) {
            sessionStorage.clear();
            window.location.replace("index.html");
        }

        window.addEventListener("pageshow", function (event) {
            if (event.persisted) {
                const user = JSON.parse(sessionStorage.getItem("user") || "null");
                if (!user || !user.email) {
                    window.location.replace("index.html");
                }
            }
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - UniSupport</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        /* Smooth transitions */
        * {
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #3f3f46;
        }

        .btn-press:active {
            transform: scale(0.96);
            transition: transform 0.1s;
        }

        /* Status Badge Tweak */
        .status-badge {
            font-weight: 600;
            letter-spacing: 0.025em;
        }
    </style>
</head>

<body class="bg-[#f4f5f7] dark:bg-zinc-950 text-gray-800 dark:text-gray-200 min-h-screen overflow-x-hidden flex">

    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-[260px] bg-white dark:bg-zinc-900 border-r border-gray-200 dark:border-zinc-800 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-sm dark:shadow-none flex flex-col">
        <div class="h-[75px] px-6 flex items-center border-b border-gray-100 dark:border-zinc-800">
            <div class="flex items-center gap-2">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-600 to-indigo-400 text-white flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-graduation-cap text-sm"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-[#3b5278] dark:text-gray-100">Uni<span
                        class="text-indigo-600 dark:text-indigo-400">Support</span></h1>
            </div>
        </div>

        <nav class="flex-1 pt-6 pb-4 space-y-1">
            <p class="px-6 text-[11px] font-semibold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">
                Main Menu</p>

            <a href="dashboard.html"
                class="nav-item mx-3 px-3 py-2.5 rounded-md flex items-center text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-zinc-800/50 font-medium text-sm transition-colors">
                <i class="fa-solid fa-table-columns w-6 text-center"></i>
                <span class="ml-2">Dashboard</span>
            </a>

            <a href="my-complaints.html"
                class="nav-item mx-3 px-3 py-2.5 rounded-md flex items-center bg-blue-50 dark:bg-zinc-800 text-blue-700 dark:text-indigo-300 font-medium text-sm transition-colors relative">
                <span
                    class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-indigo-600 dark:bg-indigo-400 rounded-r-md"></span>
                <i class="fa-solid fa-ticket w-6 text-center"></i>
                <span class="ml-2">My Tickets</span>
            </a>

            <a href="add-complaint.html"
                class="nav-item mx-3 px-3 py-2.5 rounded-md flex items-center text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-zinc-800/50 font-medium text-sm transition-colors">
                <i class="fa-solid fa-plus-circle w-6 text-center"></i>
                <span class="ml-2">New Request</span>
            </a>

            <div class="my-5 border-t border-gray-100 dark:border-zinc-800"></div>

            <p class="px-6 text-[11px] font-semibold text-gray-400 dark:text-zinc-500 uppercase tracking-wider mb-3">
                System</p>

            <a href="dashboard.html"
                class="nav-item mx-3 px-3 py-2.5 rounded-md flex items-center text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-zinc-800/50 font-medium text-sm transition-colors">
                <i class="fa-solid fa-chart-line w-6 text-center"></i>
                <span class="ml-2">Reports</span>
            </a>
        </nav>

        <div class="p-4 border-t border-gray-100 dark:border-zinc-800 bg-gray-50/50 dark:bg-zinc-900">
            <div class="flex items-center gap-3">
                <img id="userAvatar"
     src=""
     class="w-9 h-9 rounded-full border-2 border-white dark:border-zinc-700 shadow-sm">
                <div class="flex-1 min-w-0">
                    <p id="username" class="text-sm font-semibold text-gray-800 dark:text-gray-200 truncate">User</p>
                    <a href="#" onclick="logout()" class="text-red-500">Logout</a>
                </div>
            </div>
        </div>
    </aside>

    <div id="mobile-overlay" class="fixed inset-0 bg-gray-900/60 z-30 hidden md:hidden transition-opacity"></div>

    <main class="flex-1 md:ml-[260px] flex flex-col min-h-screen relative">

        <header
            class="h-[75px] bg-white dark:bg-zinc-900 border-b border-gray-200 dark:border-zinc-800 px-6 flex items-center justify-between sticky top-0 z-20 shadow-sm dark:shadow-none">
            <div class="flex items-center">
                <button id="sidebar-toggle"
                    class="md:hidden mr-4 text-gray-500 dark:text-gray-400 p-2 rounded-md hover:bg-gray-100 dark:hover:bg-zinc-800 btn-press">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <h2 class="text-lg font-bold text-gray-800 dark:text-gray-100">My Complaint History</h2>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()"
                    class="w-9 h-9 rounded-md flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-zinc-800 transition-colors btn-press">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
                <button onclick="window.location.href='add-complaint.html'"
                    class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-indigo-700 transition-colors shadow-sm btn-press">
                    <i class="fa-solid fa-plus mr-1 text-xs"></i> New Ticket
                </button>
            </div>
        </header>

        <div class="p-6 lg:p-8 flex-1 animate-[fadeIn_0.4s_ease-out]">

            <div class="flex flex-col md:flex-row gap-4 justify-between mb-6">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400 dark:text-zinc-500 text-sm"></i>
                    <input type="text" id="ticketSearch" onkeyup="filterTickets()"
                        placeholder="Search by ID or Title..."
                        class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 dark:focus:border-indigo-500 transition-all shadow-sm dark:shadow-none">
                </div>

                <div class="flex gap-2">
                    <select id="statusFilter" onchange="filterTickets()"
                        class="px-4 py-2 bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-lg text-sm focus:outline-none focus:border-indigo-500 shadow-sm dark:shadow-none transition-all">
                        <option value="all">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </div>
            </div>

            <div
                class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-xl shadow-sm dark:shadow-none overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse" id="ticketsTable">
                        <thead>
                            <tr
                                class="bg-gray-50/50 dark:bg-zinc-950/50 text-[11px] uppercase tracking-widest text-gray-500 dark:text-zinc-400 font-bold border-b border-gray-200 dark:border-zinc-800">
                                <th class="px-6 py-4">Ticket ID</th>
                                <th class="px-6 py-4">Issue Description</th>
                                <th class="px-6 py-4">Category</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4">Date</th>

                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-100 dark:divide-zinc-800/50"></tbody>
                    </table>

                    <div id="emptyState" class="hidden py-20 text-center">
                        <i class="fa-solid fa-ticket-slash text-4xl text-gray-300 dark:text-zinc-700 mb-4"></i>
                        <p class="text-gray-500 dark:text-zinc-500 font-medium">No tickets found matching your search.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function logout() {
            sessionStorage.removeItem("user");
            serverLogout().finally(() => {
                sessionStorage.setItem("logoutSuccess", "true");
                window.location.replace("index.html");
            });
        }

        // SIDEBAR TOGGLE
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');
        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            mobileOverlay.classList.toggle('hidden');
        }
        document.getElementById('sidebar-toggle')?.addEventListener('click', toggleSidebar);
        mobileOverlay.addEventListener('click', toggleSidebar);

        // DARK MODE
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun';
        }

        // SEARCH & FILTER LOGIC
        function filterTickets() {
            const searchInput = document.getElementById('ticketSearch').value.trim().toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value.toLowerCase();

            const rows = document.querySelectorAll('.ticket-row');

            let visibleCount = 0;

            rows.forEach(row => {
                const title = row.querySelector('.ticket-title').innerText.toLowerCase();
                const id = row.querySelector('td:first-child').innerText.toLowerCase();
                const status = row.querySelector('.status-badge')
                    .innerText
                    .trim()
                    .toLowerCase();


                const matchesSearch =
                    searchInput === "" ||
                    title.includes(searchInput) ||
                    id.includes(searchInput);

                const matchesStatus =
                    statusFilter === 'all' ||
                    status.trim() === statusFilter.trim();

                if (matchesSearch && matchesStatus) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }

            });

            // Show empty state if no tickets found
            const emptyState = document.getElementById('emptyState');
            const table = document.getElementById("ticketsTable");

            if (visibleCount === 0) {
                emptyState.classList.remove('hidden');
                table.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                table.classList.remove('hidden');
            }
        }
    </script>
    <script>
        function loadComplaints() {
            fetch("/api/complaints")
                .then(res => res.json())
                .then(data => {
                    const table = document.getElementById("tableBody");
                    table.innerHTML = "";

                    const user = JSON.parse(sessionStorage.getItem("user") || "null");

                    const myComplaints = data.filter(c =>
                        c.userEmail === user.email
                    );

                    myComplaints.forEach(c => {

                        let statusColor = "bg-blue-50 text-blue-700";
                        if (c.status === "PENDING") statusColor = "bg-blue-50 text-blue-700";
                        if (c.status === "IN_PROGRESS") statusColor = "bg-amber-50 text-amber-700";
                        if (c.status === "RESOLVED") statusColor = "bg-emerald-50 text-emerald-700";

                        const row = `
    <tr class="ticket-row hover:bg-gray-50/80 dark:hover:bg-zinc-800/50 transition-colors cursor-pointer"
onclick="openTicket(${c.id})">
        <td class="px-6 py-5">
            <span class="font-mono text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">#${c.id}</span>
        </td>

        <td class="px-6 py-5">
            <p class="font-semibold ticket-title">
${escapeHtml((c.title || "").toLowerCase().replace(/\b\w/g, l => l.toUpperCase()))}
</p>
            <p class="text-xs text-gray-500 mt-1 cursor-pointer" onclick="toggleDesc(this)">
                <span class="short-text">
                    ${escapeHtml(c.description ? c.description.substring(0, 80) + "..." : "")}
                </span>
                <span class="full-text hidden">
                    ${escapeHtml(c.description)}
                </span>
            </p>
        </td>

        <td class="px-6 py-5 text-sm">${escapeHtml(c.category)}</td>

        <td class="px-6 py-5">
    <span class="status-badge px-2.5 py-1 text-[10px] font-bold uppercase rounded border ${statusColor}">
        ${escapeHtml(c.status)}
    </span>

    
</td>

        <td class="px-6 py-5 text-xs">${escapeHtml(c.createdAt)}</td>
    </tr>
    `;

                        table.innerHTML += row;
                    });
                });
        }
        function resolveComplaint(id) {
            fetch(`/api/complaints/${id}?status=RESOLVED`, {
                method: "PUT"
            })
                .then(res => {
                    if (!res.ok) throw new Error("Failed");
                    alert("Complaint Resolved!");
                    loadComplaints(); // refresh table
                })
                .catch(err => {
                    console.log(err);
                    alert("Error!");
                });
        }
        function toggleDesc(el) {
            const shortText = el.querySelector(".short-text");
            const fullText = el.querySelector(".full-text");

            if (fullText.classList.contains("hidden")) {
                fullText.classList.remove("hidden");
                shortText.classList.add("hidden");
            } else {
                fullText.classList.add("hidden");
                shortText.classList.remove("hidden");
            }
        }
        function showComment(comment) {
            alert("Admin Comment:\n\n" + comment);
        }
        function openTicket(id) {

            window.location.href = `ticket-details.html?id=${id}`;

        }

        window.addEventListener("DOMContentLoaded", loadComplaints);
        const currentUser =
    JSON.parse(sessionStorage.getItem("user") || "null");

if (currentUser && currentUser.name) {

    document.getElementById("username").innerText =
        currentUser.name;

    document.getElementById("userAvatar").src =
        `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.name)}&background=cbd5e1&color=334155`;
}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script>
        function showToast(message, success = true) {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "bottom",
                position: "right",
                close: true,
                stopOnFocus: true,
                style: {
                    background: success
                        ? "linear-gradient(to right, #00b09b, #96c93d)"
                        : "linear-gradient(to right, #ff416c, #ff4b2b)"
                }
            }).showToast();
        }
    </script>
</body>

</html>
